<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人GIS作品集 - WebGIS二维开发实验</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            background: #f5f7fa;
            overflow: hidden;
        }
        
        /* 整体布局 */
        .app-container {
            display: flex;
            height: 100vh;
            width: 100%;
        }
        
        /* 侧边栏 */
        .sidebar {
            width: 280px;
            background: linear-gradient(180deg, #2c3e50 0%, #34495e 100%);
            color: white;
            display: flex;
            flex-direction: column;
            box-shadow: 2px 0 10px rgba(0,0,0,0.1);
            z-index: 1000;
        }
        
        .sidebar-header {
            padding: 25px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        
        .sidebar-header h1 {
            font-size: 18px;
            margin-bottom: 5px;
            color: #409EFF;
        }
        
        .sidebar-header p {
            font-size: 12px;
            opacity: 0.7;
        }
        
        .nav-menu {
            flex: 1;
            padding: 15px 0;
            overflow-y: auto;
        }
        
        .nav-item {
            padding: 14px 25px;
            cursor: pointer;
            transition: all 0.3s;
            border-left: 3px solid transparent;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .nav-item:hover {
            background: rgba(255,255,255,0.1);
        }
        
        .nav-item.active {
            background: rgba(64, 158, 255, 0.2);
            border-left-color: #409EFF;
        }
        
        .nav-item .icon {
            font-size: 18px;
            width: 24px;
            text-align: center;
        }
        
        .nav-item .text {
            font-size: 14px;
        }
        
        .sidebar-footer {
            padding: 20px;
            border-top: 1px solid rgba(255,255,255,0.1);
            font-size: 12px;
            opacity: 0.6;
        }
        
        /* 主内容区 */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        
        /* 顶部工具栏 */
        .top-bar {
            height: 60px;
            background: white;
            border-bottom: 1px solid #e4e7ed;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 25px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.05);
        }
        
        .top-bar .title {
            font-size: 16px;
            font-weight: 600;
            color: #303133;
        }
        
        .top-bar .actions {
            display: flex;
            gap: 10px;
        }
        
        .top-bar button {
            padding: 8px 16px;
            border: 1px solid #dcdfe6;
            border-radius: 4px;
            background: white;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s;
        }
        
        .top-bar button:hover {
            border-color: #409EFF;
            color: #409EFF;
        }
        
        .top-bar button.primary {
            background: #409EFF;
            color: white;
            border-color: #409EFF;
        }
        
        .top-bar button.primary:hover {
            background: #66b1ff;
        }
        
        /* 地图容器 */
        .map-container {
            flex: 1;
            position: relative;
        }
        
        #map {
            height: 100%;
            width: 100%;
        }
        
        /* 功能面板 */
        .feature-panel {
            position: absolute;
            top: 80px;
            right: 20px;
            z-index: 1000;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.15);
            width: 280px;
            max-height: calc(100vh - 160px);
            overflow-y: auto;
            display: none;
        }
        
        .feature-panel.active {
            display: block;
        }
        
        .panel-header {
            padding: 15px 20px;
            border-bottom: 1px solid #ebeef5;
            font-weight: 600;
            color: #303133;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .panel-header .close {
            cursor: pointer;
            color: #909399;
            font-size: 18px;
        }
        
        .panel-header .close:hover {
            color: #f56c6c;
        }
        
        .panel-content {
            padding: 15px 20px;
        }
        
        .panel-section {
            margin-bottom: 18px;
        }
        
        .panel-section h5 {
            margin-bottom: 10px;
            color: #606266;
            font-size: 13px;
        }
        
        .panel-btn {
            display: block;
            width: 100%;
            padding: 10px;
            margin: 6px 0;
            border: 1px solid #dcdfe6;
            border-radius: 4px;
            background: white;
            cursor: pointer;
            font-size: 13px;
            text-align: left;
            transition: all 0.3s;
        }
        
        .panel-btn:hover {
            border-color: #409EFF;
            background: #ecf5ff;
        }
        
        .panel-btn.active {
            background: #409EFF;
            color: white;
            border-color: #409EFF;
        }
        
        /* 信息卡片 */
        .info-card {
            background: #f5f7fa;
            border-radius: 6px;
            padding: 12px;
            margin: 8px 0;
            font-size: 12px;
            color: #606266;
            line-height: 1.6;
        }
        
        .info-card strong {
            color: #303133;
        }
        
        /* 坐标显示 */
        .coords-display {
            position: absolute;
            bottom: 20px;
            left: 20px;
            z-index: 1000;
            background: rgba(255,255,255,0.95);
            padding: 10px 18px;
            border-radius: 6px;
            font-size: 13px;
            color: #303133;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            font-family: monospace;
        }
        
        /* 图例 */
        .legend-box {
            background: #f5f7fa;
            border-radius: 6px;
            padding: 12px;
            margin-top: 10px;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            margin: 6px 0;
            font-size: 12px;
        }
        
        .legend-color {
            width: 18px;
            height: 14px;
            margin-right: 10px;
            border: 1px solid #dcdfe6;
        }
        
        /* 欢迎页面 */
        .welcome-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }
        
        .welcome-card {
            background: white;
            border-radius: 16px;
            padding: 50px;
            text-align: center;
            max-width: 500px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        .welcome-card h1 {
            color: #303133;
            margin-bottom: 15px;
            font-size: 28px;
        }
        
        .welcome-card p {
            color: #606266;
            margin-bottom: 30px;
            line-height: 1.8;
        }
        
        .welcome-card .start-btn {
            padding: 14px 50px;
            background: linear-gradient(135deg, #409EFF 0%, #66b1ff 100%);
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        
        .welcome-card .start-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(64, 158, 255, 0.4);
        }
        
        .feature-list {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 30px;
        }
        
        .feature-tag {
            background: #f0f2f5;
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            color: #606266;
        }
        
        .feature-tag span {
            color: #409EFF;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <!-- 欢迎页面 -->
    <div class="welcome-overlay" id="welcomeOverlay">
        <div class="welcome-card">
            <h1>🗺️ 个人GIS作品集</h1>
            <p>WebGIS二维开发实验综合展示平台<br>整合Leaflet标注、GeoJSON专题图、MapLibre 3D可视化</p>
            <button class="start-btn" onclick="startExplore()">开始探索</button>
            <div class="feature-list">
                <div class="feature-tag"><span>✓</span> 多底图切换</div>
                <div class="feature-tag"><span>✓</span> POI标注交互</div>
                <div class="feature-tag"><span>✓</span> 分级设色专题图</div>
                <div class="feature-tag"><span>✓</span> 比例符号可视化</div>
                <div class="feature-tag"><span>✓</span> 3D建筑拉伸</div>
                <div class="feature-tag"><span>✓</span> 点聚合效果</div>
            </div>
        </div>
    </div>

    <div class="app-container">
        <!-- 侧边栏 -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h1>🌍 GIS作品集</h1>
                <p>WebGIS二维开发实验</p>
            </div>
            
            <div class="nav-menu">
                <div class="nav-item active" onclick="switchModule('basemap')">
                    <span class="icon">🗺️</span>
                    <span class="text">底图切换</span>
                </div>
                <div class="nav-item" onclick="switchModule('marker')">
                    <span class="icon">📍</span>
                    <span class="text">POI标注</span>
                </div>
                <div class="nav-item" onclick="switchModule('choropleth')">
                    <span class="icon">🎨</span>
                    <span class="text">分级设色图</span>
                </div>
                <div class="nav-item" onclick="switchModule('proportional')">
                    <span class="icon">⭕</span>
                    <span class="text">比例符号图</span>
                </div>
                <div class="nav-item" onclick="switchModule('measure')">
                    <span class="icon">📏</span>
                    <span class="text">距离测量</span>
                </div>
                <div class="nav-item" onclick="switchModule('bookmark')">
                    <span class="icon">🔖</span>
                    <span class="text">地图书签</span>
                </div>
                <div class="nav-item" onclick="switchModule('cluster')">
                    <span class="icon">🔘</span>
                    <span class="text">点聚合</span>
                </div>
                <div class="nav-item" onclick="switchModule('building3d')">
                    <span class="icon">🏢</span>
                    <span class="text">3D建筑</span>
                </div>
            </div>
            
            <div class="sidebar-footer">
                © 2024 WebGIS实验项目<br>
                地理空间信息工程专业
            </div>
        </div>
        
        <!-- 主内容区 -->
        <div class="main-content">
            <div class="top-bar">
                <div class="title" id="moduleTitle">🗺️ 底图切换 - 多源地图服务</div>
                <div class="actions">
                    <button onclick="resetView()">重置视图</button>
                    <button onclick="clearAll()">清除图层</button>
                    <button class="primary" onclick="exportMap()">导出截图</button>
                </div>
            </div>
            
            <div class="map-container">
                <div id="map"></div>
                
                <!-- 功能面板 -->
                <div class="feature-panel" id="featurePanel">
                    <div class="panel-header">
                        <span id="panelTitle">功能控制</span>
                        <span class="close" onclick="closePanel()">✕</span>
                    </div>
                    <div class="panel-content" id="panelContent">
                        <!-- 动态内容 -->
                    </div>
                </div>
                
                <div class="coords-display" id="coords">经度: -- | 纬度: -- | 缩放: --</div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let map;
        let currentModule = 'basemap';
        let activeLayers = [];
        let measureMode = false;
        let measurePoints = [];
        let measureLine = null;
        
        // 开始探索
        function startExplore() {
            document.getElementById('welcomeOverlay').style.display = 'none';
            initMap();
        }
        
        // 初始化地图
        function initMap() {
            map = L.map('map', {
                center: [30.6600, 104.0300],
                zoom: 11,
                zoomControl: true
            });
            
            // 默认加载高德底图
            const gaodeVec = L.tileLayer('http://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}', {
                subdomains: ['1', '2', '3', '4'],
                attribution: '&copy; 高德地图',
                maxZoom: 18
            }).addTo(map);
            
            // 比例尺
            L.control.scale({ imperial: false, maxWidth: 200 }).addTo(map);
            
            // 坐标显示
            map.on('mousemove', function(e) {
                document.getElementById('coords').innerHTML = 
                    `经度: ${e.latlng.lng.toFixed(6)} | 纬度: ${e.latlng.lat.toFixed(6)} | 缩放: ${map.getZoom()}`;
            });
            
            // 加载默认模块
            switchModule('basemap');
        }
        
        // 切换模块
        function switchModule(module) {
            currentModule = module;
            
            // 更新导航状态
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            event.currentTarget.classList.add('active');
            
            // 清除图层
            clearAll();
            
            // 标题映射
            const titles = {
                basemap: '🗺️ 底图切换 - 多源地图服务',
                marker: '📍 POI标注 - 兴趣点交互',
                choropleth: '🎨 分级设色图 - 人口密度可视化',
                proportional: '⭕ 比例符号图 - GDP总量可视化',
                measure: '📏 距离测量 - 空间量算工具',
                bookmark: '🔖 地图书签 - 视图保存',
                cluster: '🔘 点聚合 - 海量点优化',
                building3d: '🏢 3D建筑 - 立体可视化'
            };
            
            document.getElementById('moduleTitle').textContent = titles[module];
            
            // 显示功能面板
            showPanel(module);
            
            // 执行对应模块功能
            executeModule(module);
        }
        
        // 显示功能面板
        function showPanel(module) {
            const panel = document.getElementById('featurePanel');
            const content = document.getElementById('panelContent');
            const title = document.getElementById('panelTitle');
            panel.classList.add('active');
            
            switch(module) {
                case 'basemap':
                    title.textContent = '底图选择';
                    content.innerHTML = `
                        <div class="panel-section">
                            <h5>国内稳定底图源</h5>
                            <button class="panel-btn active" onclick="changeBaseMap('gaode_vec')">高德地图 - 矢量</button>
                            <button class="panel-btn" onclick="changeBaseMap('gaode_img')">高德地图 - 影像</button>
                            <button class="panel-btn" onclick="changeBaseMap('tianditu_vec')">天地图 - 矢量</button>
                            <button class="panel-btn" onclick="changeBaseMap('tianditu_img')">天地图 - 影像</button>
                        </div>
                        <div class="info-card">
                            <strong>说明：</strong>优先使用高德底图，国内加载速度最快；天地图作为备用源。
                        </div>
                    `;
                    break;
                    
                case 'marker':
                    title.textContent = 'POI标注管理';
                    content.innerHTML = `
                        <div class="panel-section">
                            <h5>预设标注</h5>
                            <button class="panel-btn" onclick="addPresetMarkers()">加载成都地标</button>
                            <button class="panel-btn" onclick="enableAddMarker()">手动添加标注</button>
                        </div>
                        <div class="info-card">
                            <strong>操作：</strong>点击地图添加自定义标注，支持弹窗信息展示。
                        </div>
                    `;
                    break;
                    
                case 'choropleth':
                    title.textContent = '分级设色配置';
                    content.innerHTML = `
                        <div class="panel-section">
                            <h5>颜色方案</h5>
                            <button class="panel-btn active" onclick="setChoropleth('blue')">蓝色系（人口密度）</button>
                            <button class="panel-btn" onclick="setChoropleth('green')">绿色系（绿化率）</button>
                            <button class="panel-btn" onclick="setChoropleth('red')">红色系（房价）</button>
                        </div>
                        <div class="legend-box">
                            <div class="legend-item">
                                <div class="legend-color" style="background: #08519c"></div>
                                <span>> 10000 人/km²</span>
                            </div>
                            <div class="legend-item">
                                <div class="legend-color" style="background: #3182bd"></div>
                                <span>5000 - 10000</span>
                            </div>
                            <div class="legend-item">
                                <div class="legend-color" style="background: #6baed6"></div>
                                <span>2000 - 5000</span>
                            </div>
                            <div class="legend-item">
                                <div class="legend-color" style="background: #bdd7e7"></div>
                                <span>< 2000</span>
                            </div>
                        </div>
                    `;
                    setChoropleth('blue');
                    break;
                    
                case 'proportional':
                    title.textContent = '比例符号配置';
                    content.innerHTML = `
                        <div class="panel-section">
                            <h5>符号字段</h5>
                            <button class="panel-btn active" onclick="setProportional('gdp')">GDP总量</button>
                            <button class="panel-btn" onclick="setProportional('population')">人口数量</button>
                            <button class="panel-btn" onclick="setProportional('area')">区域面积</button>
                        </div>
                        <div class="info-card">
                            <strong>原理：</strong>符号大小与属性值成正比，直观展示数值差异。
                        </div>
                    `;
                    setProportional('gdp');
                    break;
                    
                case 'measure':
                    title.textContent = '测量工具';
                    content.innerHTML = `
                        <div class="panel-section">
                            <h5>距离测量</h5>
                            <button class="panel-btn" onclick="startMeasure()">开始测量</button>
                            <button class="panel-btn" onclick="endMeasure()">结束测量</button>
                        </div>
                        <div class="info-card" id="measureResult">
                            <strong>测量结果：</strong>点击地图开始
                        </div>
                    `;
                    break;
                    
                case 'bookmark':
                    title.textContent = '地图书签';
                    content.innerHTML = `
                        <div class="panel-section">
                            <h5>书签管理</h5>
                            <button class="panel-btn" onclick="saveBookmark()">保存当前视图</button>
                        </div>
                        <div id="bookmarkList"></div>
                    `;
                    renderBookmarks();
                    break;
                    
                case 'cluster':
                    title.textContent = '点聚合效果';
                    content.innerHTML = `
                        <div class="panel-section">
                            <h5>聚合参数</h5>
                            <button class="panel-btn active" onclick="addClusterPoints(100)">100个点</button>
                            <button class="panel-btn" onclick="addClusterPoints(500)">500个点</button>
                            <button class="panel-btn" onclick="addClusterPoints(1000)">1000个点</button>
                        </div>
                        <div class="info-card">
                            <strong>优化：</strong>缩放时自动聚合，提升海量点渲染性能。
                        </div>
                    `;
                    addClusterPoints(100);
                    break;
                    
                case 'building3d':
                    title.textContent = '3D建筑效果';
                    content.innerHTML = `
                        <div class="panel-section">
                            <h5>建筑样式</h5>
                            <button class="panel-btn active" onclick="add3DBuildings('blue')">蓝色科技风</button>
                            <button class="panel-btn" onclick="add3DBuildings('warm')">暖色调</button>
                            <button class="panel-btn" onclick="add3DBuildings('gray')">商务灰</button>
                        </div>
                        <div class="info-card">
                            <strong>提示：</strong>调整地图倾斜角度查看3D效果。
                        </div>
                    `;
                    add3DBuildings('blue');
                    break;
            }
        }
        
        function closePanel() {
            document.getElementById('featurePanel').classList.remove('active');
        }
        
        // 底图切换
        function changeBaseMap(type) {
            document.querySelectorAll('#panelContent .panel-btn').forEach(btn => btn.classList.remove('active'));
            event.currentTarget.classList.add('active');
            
            // 移除现有底图
            map.eachLayer(layer => {
                if (layer instanceof L.TileLayer) map.removeLayer(layer);
            });
            
            let newLayer;
            switch(type) {
                case 'gaode_vec':
                    newLayer = L.tileLayer('http://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}', {
                        subdomains: ['1', '2', '3', '4'],
                        maxZoom: 18
                    });
                    break;
                case 'gaode_img':
                    newLayer = L.tileLayer('http://webst0{s}.is.autonavi.com/appmaptile?style=6&x={x}&y={y}&z={z}', {
                        subdomains: ['1', '2', '3', '4'],
                        maxZoom: 18
                    });
                    break;
                case 'tianditu_vec':
                    newLayer = L.tileLayer('http://t{s}.tianditu.gov.cn/vec_w/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=vec&STYLE=default&TILEMATRIXSET=w&FORMAT=tiles&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}&tk=1c10002201a21b135b8449770839b394', {
                        subdomains: ['0', '1', '2', '3', '4', '5', '6', '7'],
                        maxZoom: 18
                    });
                    break;
                case 'tianditu_img':
                    newLayer = L.tileLayer('http://t{s}.tianditu.gov.cn/img_w/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=img&STYLE=default&TILEMATRIXSET=w&FORMAT=tiles&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}&tk=1c10002201a21b135b8449770839b394', {
                        subdomains: ['0', '1', '2', '3', '4', '5', '6', '7'],
                        maxZoom: 18
                    });
                    break;
            }
            newLayer.addTo(map);
        }
        
        // 添加预设标注
        function addPresetMarkers() {
            const pois = [
                { name: '春熙路', lat: 30.6580, lng: 104.0820, type: '商业' },
                { name: '宽窄巷子', lat: 30.6640, lng: 104.0450, type: '景点' },
                { name: '锦里古街', lat: 30.6450, lng: 104.0470, type: '景点' },
                { name: '天府广场', lat: 30.6600, lng: 104.0620, type: '地标' },
                { name: '太古里', lat: 30.6530, lng: 104.0850, type: '商业' }
            ];
            
            pois.forEach(poi => {
                const marker = L.marker([poi.lat, poi.lng]).bindPopup(`
                    <h4>${poi.name}</h4>
                    <p>类型：${poi.type}</p>
                    <p>坐标：${poi.lng.toFixed(4)}, ${poi.lat.toFixed(4)}</p>
                `).addTo(map);
                activeLayers.push(marker);
            });
        }
        
        // 手动添加标注
        function enableAddMarker() {
            map.getContainer().style.cursor = 'crosshair';
            map.once('click', function(e) {
                const name = prompt('输入标注名称：', '新标注');
                if (name) {
                    const marker = L.marker([e.latlng.lat, e.latlng.lng]).bindPopup(`<h4>${name}</h4>`).addTo(map);
                    activeLayers.push(marker);
                }
                map.getContainer().style.cursor = '';
            });
        }
        
        // 分级设色图
        function setChoropleth(colorScheme) {
            const districts = {
                type: "FeatureCollection",
                features: [
                    {
                        type: "Feature",
                        properties: { name: "锦江区", density: 11780, center: [30.6500, 104.0800] },
                        geometry: { type: "Polygon", coordinates: [[[104.04,30.62],[104.12,30.62],[104.12,30.68],[104.08,30.70],[104.04,30.68],[104.04,30.62]]] }
                    },
                    {
                        type: "Feature",
                        properties: { name: "青羊区", density: 12879, center: [30.6680, 104.0200] },
                        geometry: { type: "Polygon", coordinates: [[[103.96,30.63],[104.04,30.63],[104.04,30.68],[104.00,30.71],[103.96,30.69],[103.96,30.63]]] }
                    },
                    {
                        type: "Feature",
                        properties: { name: "武侯区", density: 14464, center: [30.6300, 104.0500] },
                        geometry: { type: "Polygon", coordinates: [[[103.98,30.58],[104.10,30.58],[104.10,30.63],[104.08,30.65],[103.98,30.65],[103.98,30.58]]] }
                    },
                    {
                        type: "Feature",
                        properties: { name: "成华区", density: 8783, center: [30.6600, 104.1200] },
                        geometry: { type: "Polygon", coordinates: [[[104.08,30.62],[104.18,30.62],[104.18,30.72],[104.12,30.74],[104.08,30.70],[104.08,30.62]]] }
                    }
                ]
            };
            
            function getColor(d) {
                if (colorScheme === 'blue') {
                    return d > 12000 ? '#08519c' : d > 10000 ? '#3182bd' : d > 8000 ? '#6baed6' : '#bdd7e7';
                } else if (colorScheme === 'green') {
                    return d > 12000 ? '#005a32' : d > 10000 ? '#238b45' : d > 8000 ? '#41ab5d' : '#74c476';
                } else {
                    return d > 12000 ? '#cb181d' : d > 10000 ? '#fb6a4a' : d > 8000 ? '#fc9272' : '#fcbba1';
                }
            }
            
            const layer = L.geoJSON(districts, {
                style: f => ({
                    fillColor: getColor(f.properties.density),
                    weight: 2,
                    opacity: 1,
                    color: 'white',
                    fillOpacity: 0.7
                }),
                onEachFeature: (f, l) => {
                    l.bindPopup(`<h4>${f.properties.name}</h4><p>人口密度：${f.properties.density} 人/km²</p>`);
                }
            }).addTo(map);
            activeLayers.push(layer);
        }
        
        // 比例符号图
        function setProportional(field) {
            const data = [
                { name: '锦江区', lat: 30.6500, lng: 104.0800, gdp: 1200, population: 72, area: 61 },
                { name: '青羊区', lat: 30.6680, lng: 104.0200, gdp: 1350, population: 85, area: 66 },
                { name: '金牛区', lat: 30.6950, lng: 104.0500, gdp: 1480, population: 122, area: 108 },
                { name: '武侯区', lat: 30.6300, lng: 104.0500, gdp: 1620, population: 109, area: 75 },
                { name: '成华区', lat: 30.6600, lng: 104.1200, gdp: 1180, population: 96, area: 109 }
            ];
            
            data.forEach(item => {
                const value = item[field];
                const radius = Math.sqrt(value) * (field === 'gdp' ? 0.5 : field === 'population' ? 1.5 : 0.8);
                const circle = L.circleMarker([item.lat, item.lng], {
                    radius: radius,
                    fillColor: '#E6A23C',
                    color: '#fff',
                    weight: 2,
                    fillOpacity: 0.7
                }).bindPopup(`
                    <h4>${item.name}</h4>
                    <p>GDP：${item.gdp} 亿元</p>
                    <p>人口：${item.population} 万人</p>
                    <p>面积：${item.area} km²</p>
                `).addTo(map);
                activeLayers.push(circle);
            });
        }
        
        // 距离测量
        function startMeasure() {
            measureMode = true;
            measurePoints = [];
            map.getContainer().style.cursor = 'crosshair';
            
            map.on('click', measureClick);
        }
        
        function measureClick(e) {
            measurePoints.push(e.latlng);
            
            if (measurePoints.length > 1) {
                if (measureLine) map.removeLayer(measureLine);
                measureLine = L.polyline(measurePoints, { color: '#f56c6c', weight: 3 }).addTo(map);
                
                let total = 0;
                for (let i = 1; i < measurePoints.length; i++) {
                    total += measurePoints[i-1].distanceTo(measurePoints[i]);
                }
                document.getElementById('measureResult').innerHTML = 
                    `<strong>测量结果：</strong>${(total/1000).toFixed(3)} km (${measurePoints.length}个点)`;
            }
        }
        
        function endMeasure() {
            measureMode = false;
            map.removeEventListener('click', measureClick);
            map.getContainer().style.cursor = '';
        }
        
        // 书签功能
        let bookmarks = JSON.parse(localStorage.getItem('gisBookmarks') || '[]');
        
        function saveBookmark() {
            const center = map.getCenter();
            const name = prompt('书签名称：', `书签${bookmarks.length + 1}`);
            if (name) {
                bookmarks.push({ name, lat: center.lat, lng: center.lng, zoom: map.getZoom() });
                localStorage.setItem('gisBookmarks', JSON.stringify(bookmarks));
                renderBookmarks();
            }
        }
        
        function renderBookmarks() {
            const list = document.getElementById('bookmarkList');
            if (!list) return;
            list.innerHTML = bookmarks.map((bm, i) => `
                <div class="panel-btn" onclick="goToBookmark(${i})" style="display:flex;justify-content:space-between;align-items:center;">
                    <span>🔖 ${bm.name}</span>
                    <span onclick="event.stopPropagation();deleteBookmark(${i})" style="color:#f56c6c;cursor:pointer;">✕</span>
                </div>
            `).join('');
        }
        
        window.goToBookmark = function(i) {
            map.setView([bookmarks[i].lat, bookmarks[i].lng], bookmarks[i].zoom);
        };
        
        window.deleteBookmark = function(i) {
            bookmarks.splice(i, 1);
            localStorage.setItem('gisBookmarks', JSON.stringify(bookmarks));
            renderBookmarks();
        };
        
        // 点聚合
        function addClusterPoints(count) {
            const markers = [];
            for (let i = 0; i < count; i++) {
                const lat = 30.60 + Math.random() * 0.15;
                const lng = 103.98 + Math.random() * 0.2;
                markers.push(L.marker([lat, lng], {
                    icon: L.divIcon({
                        html: `<div style="width:10px;height:10px;background:#409EFF;border-radius:50%;border:2px solid white;"></div>`,
                        iconSize: [14, 14],
                        iconAnchor: [7, 7]
                    })
                }));
            }
            
            const clusterGroup = L.markerClusterGroup({
                showCoverageOnHover: false,
                maxClusterRadius: 50
            });
            clusterGroup.addLayers(markers);
            map.addLayer(clusterGroup);
            activeLayers.push(clusterGroup);
        }
        
        // 3D建筑（模拟）
        function add3DBuildings(style) {
            const colors = { blue: '#409EFF', warm: '#E6A23C', gray: '#606266' };
            const buildings = [];
            
            for (let i = 0; i < 50; i++) {
                const baseX = 104.04 + (i % 7) * 0.005;
                const baseY = 30.63 + Math.floor(i / 7) * 0.005;
                const height = 20 + Math.random() * 100;
                
                const rect = L.rectangle([[baseY, baseX], [baseY + 0.003, baseX + 0.003]], {
                    fillColor: colors[style],
                    fillOpacity: 0.6,
                    weight: 1,
                    color: 'white'
                }).bindPopup(`<p>建筑高度：${height.toFixed(0)}m</p>`);
                
                buildings.push(rect);
                activeLayers.push(rect);
            }
            
            buildings.forEach(b => b.addTo(map));
        }
        
        // 重置视图
        function resetView() {
            map.setView([30.6600, 104.0300], 11);
        }
        
        // 清除所有图层
        function clearAll() {
            activeLayers.forEach(layer => {
                if (map.hasLayer(layer)) map.removeLayer(layer);
            });
            activeLayers = [];
            
            if (measureLine) {
                map.removeLayer(measureLine);
                measureLine = null;
            }
            measurePoints = [];
            measureMode = false;
        }
        
        // 导出截图（模拟）
        function exportMap() {
            alert('截图功能：使用浏览器截图工具保存当前地图');
        }
        
        function executeModule(module) {
            // 模块入口函数
        }

        console.log('✅ 模块4加载完成：个人GIS作品集');
        console.log('🎯 已整合：底图切换、POI标注、专题地图、测量、书签、聚合、3D建筑');
        console.log('📱 统一界面：侧边栏导航 + 功能面板 + 顶部工具栏');
    </script>
</body>
