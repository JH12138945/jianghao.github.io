<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebGIS二维开发实验作品集</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            padding: 20px;
        }
        .container {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 40px;
            max-width: 800px;
            width: 100%;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 28px;
        }
        .module-card {
            background: rgba(255,255,255,0.2);
            border-radius: 10px;
            padding: 20px;
            margin: 15px 0;
            transition: transform 0.3s;
        }
        .module-card:hover {
            transform: translateY(-5px);
        }
        .module-card h3 {
            margin-bottom: 10px;
            font-size: 18px;
        }
        .module-card p {
            font-size: 14px;
            opacity: 0.9;
            margin-bottom: 15px;
        }
        .module-card a {
            display: inline-block;
            padding: 8px 20px;
            background: white;
            color: #667eea;
            text-decoration: none;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌍 WebGIS二维开发实验作品集</h1>
        
        <div class="module-card">
            <h3>模块1：Leaflet地图与标注交互</h3>
            <p>实现了多底图切换、POI标注、距离测量、地图书签等功能</p>
            <a href="module1-leaflet.html">查看演示</a>
        </div>

        <div class="module-card">
            <h3>模块2：GeoJSON专题地图</h3>
            <p>实现了分级设色图、比例符号图、交互式图例等功能</p>
            <a href="module2-geojson.html">查看演示</a>
        </div>

        <div class="module-card">
            <h3>模块3：MapLibre矢量瓦片可视化</h3>
            <p>实现了点聚合、3D建筑拉伸、多主题地图切换等功能</p>
            <a href="module3-maplibre.html">查看演示</a>
        </div>

        <div class="module-card">
            <h3>模块4：综合作品集</h3>
            <p>整合了所有实验功能的综合展示页面</p>
            <a href="module4-portfolio.html">查看演示</a>
        </div>
    </div>
</body>
</html>
